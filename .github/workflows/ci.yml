name: ci

# =============================================================================
# STAGING — setiap push ke `main` (atau dijalankan manual).
#
# 1. Resolve versi dari ./VERSION.
# 2. Build & push image backend + frontend ke GHCR.
# 3. Deploy ke server staging lewat SSH, jalankan migrasi, lalu health check.
#
# Image staging ditandai :staging, :vX.Y.Z, dan :sha-xxxxxxx.
# =============================================================================

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      component:
        description: 'Which image to build'
        type: choice
        default: both
        options: [both, backend, frontend]
      skip_deploy:
        description: 'Skip SSH deploy step'
        type: boolean
        default: false

concurrency:
  group: staging-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io

jobs:
  # ---------------------------------------------------------------------------
  # Resolve the staging version from ./VERSION file at repo root.
  # ---------------------------------------------------------------------------
  version:
    name: Resolve version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      owner_lc: ${{ steps.v.outputs.owner_lc }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Resolve version
        id: v
        run: |
          set -eo pipefail
          OWNER_LC=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')
          echo "owner_lc=${OWNER_LC}" >> "$GITHUB_OUTPUT"

          if [ ! -f VERSION ]; then
            echo "VERSION file missing"; exit 1
          fi
          VERSION=$(tr -d '[:space:]' < VERSION)
          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+ ]]; then
            echo "Invalid semver in VERSION: '$VERSION'"; exit 1
          fi
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

  # ---------------------------------------------------------------------------
  # Build & push images. Tagged with :staging, :vX.Y.Z, :sha-...
  # ---------------------------------------------------------------------------
  build:
    name: Build & push ${{ matrix.component }}
    needs: version
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - component: backend
            context: ./backend
            image: konveksi-backend
          - component: frontend
            context: ./frontend
            image: konveksi-frontend
    steps:
      - name: Skip if component filter excludes this one
        id: filter
        run: |
          want='${{ github.event.inputs.component }}'
          if [ -n "$want" ] && [ "$want" != "both" ] && [ "$want" != "${{ matrix.component }}" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout
        if: steps.filter.outputs.skip == 'false'
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Buildx
        if: steps.filter.outputs.skip == 'false'
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: steps.filter.outputs.skip == 'false'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute image metadata
        if: steps.filter.outputs.skip == 'false'
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ needs.version.outputs.owner_lc }}/${{ matrix.image }}
          tags: |
            type=raw,value=staging
            type=raw,value=v${{ needs.version.outputs.version }}
            type=sha,format=short

      - name: Build & push
        if: steps.filter.outputs.skip == 'false'
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.context }}/Dockerfile
          push: true
          platforms: linux/amd64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            APP_VERSION=${{ needs.version.outputs.version }}
            GIT_SHA=${{ github.sha }}
            VITE_API_BASE_URL=${{ vars.VITE_API_BASE_URL || '/api/v1' }}
          cache-from: type=gha,scope=${{ matrix.component }}
          cache-to: type=gha,mode=max,scope=${{ matrix.component }}
          provenance: false

  # ---------------------------------------------------------------------------
  # Deploy to staging server over SSH.
  # ---------------------------------------------------------------------------
  deploy:
    name: Deploy to staging
    needs: [version, build]
    if: github.event.inputs.skip_deploy != 'true'
    runs-on: ubuntu-latest
    concurrency:
      group: staging-deploy
      cancel-in-progress: false
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.2.0
        env:
          REGISTRY: ${{ env.REGISTRY }}
          OWNER_LC: ${{ needs.version.outputs.owner_lc }}
          APP_VERSION: ${{ needs.version.outputs.version }}
          BACKEND_IMAGE: ${{ env.REGISTRY }}/${{ needs.version.outputs.owner_lc }}/konveksi-backend:v${{ needs.version.outputs.version }}
          FRONTEND_IMAGE: ${{ env.REGISTRY }}/${{ needs.version.outputs.owner_lc }}/konveksi-frontend:v${{ needs.version.outputs.version }}
          NETWORK: konveksi-staging-net
          BACKEND_CONTAINER: konveksi-staging-backend
          FRONTEND_CONTAINER: konveksi-staging-frontend
          SQLSERVER_CONTAINER: ${{ vars.SQLSERVER_CONTAINER || 'mssql_server' }}
          BACKEND_HOST_PORT: ${{ vars.STAGING_BACKEND_HOST_PORT || '8000' }}
          FRONTEND_HOST_PORT: ${{ vars.STAGING_FRONTEND_HOST_PORT || '3080' }}
          BACKEND_ENV_FILE: ${{ vars.STAGING_BACKEND_ENV_FILE || '/opt/konveksi/staging/backend.env' }}
          PREV_ENV_FILE: ${{ vars.STAGING_PREV_ENV_FILE || '/opt/konveksi/staging/previous.env' }}
          RUN_MIGRATIONS: ${{ vars.RUN_MIGRATIONS || 'true' }}
          GHCR_USERNAME: ${{ secrets.GHCR_USERNAME }}
          GHCR_TOKEN: ${{ secrets.GHCR_TOKEN }}
          STAGING_BACKEND_ENV: ${{ secrets.STAGING_BACKEND_ENV }}
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          port: ${{ secrets.SSH_PORT }}
          key: ${{ secrets.SSH_KEY }}
          script_stop: true
          envs: REGISTRY,OWNER_LC,APP_VERSION,BACKEND_IMAGE,FRONTEND_IMAGE,NETWORK,BACKEND_CONTAINER,FRONTEND_CONTAINER,SQLSERVER_CONTAINER,BACKEND_HOST_PORT,FRONTEND_HOST_PORT,BACKEND_ENV_FILE,PREV_ENV_FILE,RUN_MIGRATIONS,GHCR_USERNAME,GHCR_TOKEN,STAGING_BACKEND_ENV
          script: |
            set -eo pipefail

            # Expand ~ ke $HOME agar path bisa dipakai di script (tilde tidak
            # diekspansi otomatis saat berada di dalam variabel).
            BACKEND_ENV_FILE="${BACKEND_ENV_FILE/#\~/$HOME}"
            PREV_ENV_FILE="${PREV_ENV_FILE/#\~/$HOME}"

            echo "========== KONVEKSI STAGING DEPLOY v${APP_VERSION} =========="
            echo "Backend  : ${BACKEND_IMAGE} -> :${BACKEND_HOST_PORT}"
            echo "Frontend : ${FRONTEND_IMAGE} -> :${FRONTEND_HOST_PORT}"
            echo "Network  : ${NETWORK}"
            echo "SQL Srv  : ${SQLSERVER_CONTAINER}"
            echo "Env file : ${BACKEND_ENV_FILE}"
            echo ""

            echo "[1/9] Login GHCR..."
            echo "${GHCR_TOKEN}" | docker login ghcr.io -u "${GHCR_USERNAME}" --password-stdin

            echo ""
            echo "[2/9] Tulis env-file backend dari secret..."
            mkdir -p "$(dirname "${BACKEND_ENV_FILE}")"
            if [ -n "${STAGING_BACKEND_ENV}" ]; then
              printf '%s\n' "${STAGING_BACKEND_ENV}" > "${BACKEND_ENV_FILE}"
              echo "  Written to ${BACKEND_ENV_FILE} ($(wc -l < "${BACKEND_ENV_FILE}") lines)"
            elif [ -f "${BACKEND_ENV_FILE}" ]; then
              echo "  Secret STAGING_BACKEND_ENV kosong; memakai ${BACKEND_ENV_FILE} yang sudah ada"
            else
              echo "ERROR: ${BACKEND_ENV_FILE} tidak ditemukan dan secret STAGING_BACKEND_ENV kosong"
              exit 1
            fi

            echo ""
            echo "[3/9] Pull image v${APP_VERSION}..."
            docker pull "${BACKEND_IMAGE}"
            docker pull "${FRONTEND_IMAGE}"

            echo ""
            echo "[4/9] Simpan versi yang saat ini berjalan (untuk rollback)..."
            PREV_BACKEND=$(docker inspect --format '{{.Config.Image}}' "${BACKEND_CONTAINER}" 2>/dev/null || echo "")
            PREV_FRONTEND=$(docker inspect --format '{{.Config.Image}}' "${FRONTEND_CONTAINER}" 2>/dev/null || echo "")
            echo "  previous backend : ${PREV_BACKEND:-<none>}"
            echo "  previous frontend: ${PREV_FRONTEND:-<none>}"
            mkdir -p "$(dirname "${PREV_ENV_FILE}")"
            printf 'BACKEND=%s\nFRONTEND=%s\n' "${PREV_BACKEND}" "${PREV_FRONTEND}" > "${PREV_ENV_FILE}"

            echo ""
            echo "[5/9] Ensure docker network & SQL Server..."
            docker network inspect "${NETWORK}" &>/dev/null || docker network create "${NETWORK}"

            # Pastikan container SQL Server ada di network yang sama dengan
            # backend, sehingga DB_HOST cukup memakai nama container.
            if docker ps -a --format '{{.Names}}' | grep -q "^${SQLSERVER_CONTAINER}$"; then
              docker network connect "${NETWORK}" "${SQLSERVER_CONTAINER}" 2>/dev/null || true
              echo "  ${SQLSERVER_CONTAINER} connected to ${NETWORK}"
            else
              echo "  WARNING: container SQL Server '${SQLSERVER_CONTAINER}' tidak ditemukan"
            fi

            echo ""
            echo "[6/9] Recreate containers..."
            for c in "${BACKEND_CONTAINER}" "${FRONTEND_CONTAINER}"; do
              if docker ps -a --format '{{.Names}}' | grep -q "^${c}$"; then
                docker stop "$c" >/dev/null 2>&1 || true
                docker rm   "$c" >/dev/null 2>&1 || true
              fi
            done

            docker run -d --name "${BACKEND_CONTAINER}" \
              --network "${NETWORK}" \
              --restart unless-stopped \
              --env-file "${BACKEND_ENV_FILE}" \
              -e "APP_VERSION=${APP_VERSION}" \
              -e "LOG_CHANNEL=stderr" \
              -e "LOG_LEVEL=debug" \
              -e "APP_DEBUG=true" \
              -p "${BACKEND_HOST_PORT}:8000" \
              "${BACKEND_IMAGE}"

            if [ "${RUN_MIGRATIONS}" = "true" ]; then
              sleep 3
              docker exec "${BACKEND_CONTAINER}" php artisan migrate --force
              docker exec "${BACKEND_CONTAINER}" php artisan config:cache || true
              docker exec "${BACKEND_CONTAINER}" php artisan route:cache  || true
            fi

            docker run -d --name "${FRONTEND_CONTAINER}" \
              --network "${NETWORK}" \
              --restart unless-stopped \
              -e "BACKEND_UPSTREAM=${BACKEND_CONTAINER}:8000" \
              -p "${FRONTEND_HOST_PORT}:80" \
              "${FRONTEND_IMAGE}"

            echo ""
            echo "[7/9] Health check..."
            sleep 2
            for c in "${BACKEND_CONTAINER}" "${FRONTEND_CONTAINER}"; do
              if ! docker ps --format '{{.Names}}' | grep -q "^${c}$"; then
                echo "ERROR: $c tidak running — rolling back"
                docker logs "$c" --tail 50 || true
                if [ -f "${PREV_ENV_FILE}" ]; then
                  . "${PREV_ENV_FILE}"
                  echo "Rolling back backend->${BACKEND} frontend->${FRONTEND}"
                  docker rm -f "${BACKEND_CONTAINER}" "${FRONTEND_CONTAINER}" 2>/dev/null || true
                  [ -n "${BACKEND}" ] && docker run -d --name "${BACKEND_CONTAINER}" \
                    --network "${NETWORK}" --restart unless-stopped \
                    --env-file "${BACKEND_ENV_FILE}" \
                    -p "${BACKEND_HOST_PORT}:8000" "${BACKEND}"
                  [ -n "${FRONTEND}" ] && docker run -d --name "${FRONTEND_CONTAINER}" \
                    --network "${NETWORK}" --restart unless-stopped \
                    -e "BACKEND_UPSTREAM=${BACKEND_CONTAINER}:8000" \
                    -p "${FRONTEND_HOST_PORT}:80" "${FRONTEND}"
                fi
                exit 1
              fi
            done

            docker ps --filter "name=konveksi-staging-" --format 'table {{.Names}}\t{{.Image}}\t{{.Status}}\t{{.Ports}}'

            echo ""
            echo "[8/9] Recent backend logs..."
            docker logs "${BACKEND_CONTAINER}" --tail 40 2>&1 || true

            echo ""
            echo "[9/9] Housekeeping..."
            docker image prune -f --filter "until=168h" >/dev/null 2>&1 || true

            echo ""
            echo "Staging deploy v${APP_VERSION} selesai."
